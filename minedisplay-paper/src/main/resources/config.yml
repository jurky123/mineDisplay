schema-version: 1
# M1 只用本地导入目录；HTTPS 导入默认关闭（M2 才开放）。
media:
  max-source-mib: 32
  max-image-pixels: 16777216
  https-import-enabled: false
  allowed-hosts: []
  base-url: ""
maps:
  max-tiles-per-display: 16
  max-total-tiles: 128
  animated-enabled: false
  animated-max-fps: 2
view:
  range-blocks: 48
  max-visible-displays-per-player: 8
playback:
  pause-when-empty: false
  sync-interval-ms: 2000
client:
  max-image-edge: 4096
  texture-budget-mib: 128
  disk-cache-mib: 512
  max-downloads: 2
  max-video-decoders: 2
  max-video-width: 1280
  max-video-height: 720
  max-video-fps: 30
  max-audible-videos: 1
# 真浏览器屏幕（方向A）：Paper 是唯一网络出口。
# 注意：8767 已被 MineAudio 本地曲库托管占用，默认用 8768。
browser:
  proxy-port: 8768
  # 监听地址：127.0.0.1=只回环（单机/开发）；0.0.0.0=公网玩家可用（记得放行端口）。
  bind-address: 127.0.0.1
  # 下发给客户端的代理基址（客户端只接受「基址+/令牌」形状的屏 URL，其余一律拒绝）。
  # 公网玩家场景示例：http://zkun.art:8768/display（需在云防火墙放行 TCP 8768，
  # IPv4/IPv6 都放行避免解析到 AAAA 时等待回退）。
  public-url: ""
  session-ttl-minutes: 30
  # 导航白名单（打开/跳转的目标站；子域自动匹配）。
  # 页面子资源（脚本/样式/图片/CDN）不受白名单限制但只允许公网地址；
  # 私网/回环地址永远被拦（防 SSRF）。
  # whitelist-enabled=false 时导航也不限站点（门户 /screens 页可切换）。
  whitelist-enabled: false
  allowed-hosts: []
  # 本地控制 API（门户“显示屏”管理页用；只绑回环，Bearer token 见控制台日志）。
  control-port: 8769
