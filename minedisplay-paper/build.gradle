plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_version}"
    // 纯 Java 协议模块：编译期依赖，构建时直接内嵌进插件 jar（沿 MineUI/MineAudio）
    compileOnly project(':minedisplay-protocol')

    testImplementation "io.papermc.paper:paper-api:${paper_version}"
    testImplementation project(':minedisplay-protocol')
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName = 'MineDisplay'
    // 把纯 Java 协议模块内嵌进插件 jar（不引入额外依赖）
    from { project(':minedisplay-protocol').sourceSets.main.output }
    dependsOn ':minedisplay-protocol:classes'
}
